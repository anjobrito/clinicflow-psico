name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          npm run lint > eslint-output.txt 2>&1
          echo $? > eslint-exit-code.txt
          cat eslint-output.txt

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics
          path: |
            eslint-output.txt
            eslint-exit-code.txt

      - name: Fail on lint errors
        run: exit $(cat eslint-exit-code.txt)

      - name: TypeScript
        run: npm run typecheck

      - name: Smoke tests
        run: npm run test:smoke

      - name: Production build
        run: npm run build
